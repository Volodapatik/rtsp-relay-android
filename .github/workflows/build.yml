name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages + NDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;26.1.10909125"

      - name: Download FFmpeg binary + libc++_shared.so (armeabi-v7a)
        run: |
          mkdir -p app/src/main/assets

          # FFmpeg (Android arm / armeabi-v7a)
          curl -L -o /tmp/ffmpeg-android-arm.zip \
            "https://github.com/Tyrrrz/FFmpegBin/releases/download/8.1.2/ffmpeg-android-arm.zip"
          unzip -o /tmp/ffmpeg-android-arm.zip -d /tmp/ffmpeg-arm
          FFMPEG_BIN=$(find /tmp/ffmpeg-arm -type f -name 'ffmpeg' | head -n 1)
          if [ -z "$FFMPEG_BIN" ]; then
            FFMPEG_BIN=$(find /tmp/ffmpeg-arm -type f | head -n 1)
          fi
          echo "FFmpeg: $FFMPEG_BIN"
          cp "$FFMPEG_BIN" app/src/main/assets/ffmpeg
          chmod +x app/src/main/assets/ffmpeg

          # libc++_shared.so from NDK (needed by this ffmpeg build)
          NDK_ROOT="$ANDROID_HOME/ndk/26.1.10909125"
          LIBCXX=$(find "$NDK_ROOT" -path "*/android-21/arch-arm/usr/lib/libc++_shared.so" | head -n 1)
          if [ -z "$LIBCXX" ]; then
            LIBCXX=$(find "$NDK_ROOT" -path "*/armeabi-v7a/libc++_shared.so" | head -n 1)
          fi
          if [ -z "$LIBCXX" ]; then
            LIBCXX=$(find "$NDK_ROOT" -name 'libc++_shared.so' | grep -E 'arm|armeabi' | head -n 1)
          fi
          echo "libc++_shared: $LIBCXX"
          if [ -n "$LIBCXX" ]; then
            cp "$LIBCXX" app/src/main/assets/libc++_shared.so
          else
            echo "WARNING: libc++_shared.so not found in NDK"
            find "$NDK_ROOT" -name 'libc++_shared.so' | head -20 || true
          fi

          ls -la app/src/main/assets/
          file app/src/main/assets/ffmpeg || true

      - name: Set up Gradle 7.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rtsp-relay-debug
          path: app/build/outputs/apk/debug/app-debug.apk
